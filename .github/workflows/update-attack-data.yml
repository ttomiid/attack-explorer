name: Actualizar datasets de MITRE (ATT&CK + D3FEND)

# Corre en un horario fijo y también se puede disparar a mano desde la pestaña Actions.
# Regenera public/data/attack-data.json (desde github.com/mitre/cti) y
# public/data/d3fend-mappings.json (desde d3fend.mitre.org). Si alguno de los dos
# cambió desde la última corrida, hace commit y push a main. Ese push dispara el
# workflow de deploy existente, así que el sitio en GitHub Pages queda actualizado
# sin intervención manual.
on:
  schedule:
    # todos los lunes 06:00 UTC. MITRE publica versiones nuevas de ATT&CK ~2 veces
    # por año y de D3FEND ~4 veces por año, así que casi todas las corridas no van
    # a encontrar cambios (y no hacen commit).
    - cron: "0 6 * * 1"
  workflow_dispatch: {} # botón "Run workflow" en la pestaña Actions, para forzarlo a mano

permissions:
  contents: write

concurrency:
  group: update-attack-data
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Descargar y regenerar attack-data.json
        run: |
          chmod +x scripts/update-data.sh
          ./scripts/update-data.sh

      - name: Descargar y regenerar d3fend-mappings.json
        run: |
          chmod +x scripts/update-d3fend-data.sh
          ./scripts/update-d3fend-data.sh

      - name: Verificar si algún dataset cambió
        id: diff
        run: |
          if git diff --quiet -- public/data/attack-data.json public/data/d3fend-mappings.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Sin cambios respecto a los datasets actuales, no hay nada que commitear."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Al menos un dataset cambió, se va a commitear la actualización."
            git diff --stat -- public/data/attack-data.json public/data/d3fend-mappings.json
          fi

      - name: Commit y push
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/attack-data.json public/data/d3fend-mappings.json
          git commit -m "chore(data): actualizar datasets de MITRE ATT&CK / D3FEND ($(date -u +%Y-%m-%d))"
          git push
