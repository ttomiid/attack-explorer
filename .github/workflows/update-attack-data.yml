name: Actualizar dataset de MITRE ATT&CK

# Corre en un horario fijo y también se puede disparar a mano desde la pestaña Actions.
# Cada vez que el bundle STIX de MITRE (github.com/mitre/cti) cambió desde la última
# corrida, regenera public/data/attack-data.json y lo commitea a main. Ese push dispara
# el workflow de deploy existente, así que el sitio en GitHub Pages queda actualizado
# sin intervención manual.
on:
  schedule:
    # todos los lunes 06:00 UTC. MITRE publica versiones nuevas ~2 veces por año,
    # así que casi todas las corridas no van a encontrar cambios (y no hacen commit).
    - cron: "0 6 * * 1"
  workflow_dispatch: {} # botón "Run workflow" en la pestaña Actions, para forzarlo a mano

permissions:
  contents: write

concurrency:
  group: update-attack-data
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Descargar y regenerar attack-data.json
        run: |
          chmod +x scripts/update-data.sh
          ./scripts/update-data.sh

      - name: Verificar si el dataset cambió
        id: diff
        run: |
          if git diff --quiet -- public/data/attack-data.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Sin cambios respecto al dataset actual, no hay nada que commitear."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "El dataset de MITRE cambió, se va a commitear la actualización."
          fi

      - name: Commit y push
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/attack-data.json
          git commit -m "chore(data): actualizar dataset de MITRE ATT&CK ($(date -u +%Y-%m-%d))"
          git push
